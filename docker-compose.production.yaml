services:
    postgres:
        image: postgres:15-alpine
        container_name: postgres_production
        restart: always
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - "${DB_PORT}:5432"
        env_file:
            - .env.production
        volumes:
            - postgres_db_vol:/var/lib/postgresql/data
        networks:
            - production-net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    api:
        container_name: api_production
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        restart: always
        ports:
            - "${API_PORT}:3001"
        env_file:
            - .env.production
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - production-net
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    web:
        container_name: web_production
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        restart: always
        ports:
            - "${WEB_PORT}:3000"
        env_file:
            - .env.production
        depends_on:
            api:
                condition: service_healthy
        networks:
            - production-net

volumes:
    postgres_db_vol: {}

networks:
    production-net:
        driver: bridge
